<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivi des Canaux - Douaisis</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #38bdf8;
            --normal: #22c55e;
            --vigilance: #eab308;
            --alerte: #ef4444;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 1.5rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        h1 {
            font-size: 1.3rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .refresh-btn {
            background-color: var(--card-bg);
            color: var(--accent);
            border: 1px solid var(--border);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .refresh-btn:hover {
            background-color: var(--border);
        }

        .quick-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background-color: var(--card-bg);
            padding: 1rem;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .stat-card span {
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        .stat-card p {
            font-size: 1.4rem;
            font-weight: bold;
            margin-top: 0.25rem;
        }

        .grid-stations {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.25rem;
        }

        .station-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 1.25rem;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .status-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
        }

        .status-normal { background-color: var(--normal); }
        .status-vigilance { background-color: var(--vigilance); }
        .status-alerte { background-color: var(--alerte); }

        .station-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .station-name {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .station-course {
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-top: 0.2rem;
        }

        .badge {
            font-size: 0.75rem;
            padding: 0.25rem 0.5rem;
            border-radius: 20px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-normal { background: rgba(34, 197, 94, 0.15); color: var(--normal); }
        .badge-vigilance { background: rgba(234, 179, 8, 0.15); color: var(--vigilance); }
        .badge-alerte { background: rgba(239, 68, 68, 0.15); color: var(--alerte); }

        .metrics {
            display: flex;
            justify-content: space-between;
            margin: 1rem 0;
            background: rgba(15, 23, 42, 0.5);
            padding: 0.75rem;
            border-radius: 8px;
        }

        .metric-val {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--accent);
        }

        .metric-lbl {
            font-size: 0.75rem;
            color: var(--text-sub);
        }

        .footer-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-sub);
            margin-top: 0.5rem;
        }

        .external-link {
            color: var(--accent);
            text-decoration: none;
        }

        .external-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <header>
        <h1>💧 Canaux & Cours d'eau du Douaisis</h1>
        <button class="refresh-btn" onclick="fetchStationData()">🔄 Actualiser</button>
    </header>

    <div class="quick-stats">
        <div class="stat-card">
            <span>Secteur surveillé</span>
            <p>Douaisis / Scarpe</p>
        </div>
        <div class="stat-card">
            <span>Stations suivies</span>
            <p id="total-stations">4</p>
        </div>
        <div class="stat-card">
            <span>État global</span>
            <p style="color: var(--normal);" id="global-status">Vigilance Normale</p>
        </div>
    </div>

    <div class="grid-stations" id="stations-container">
        <!-- Les cartes des stations seront injectées ici par JavaScript -->
    </div>

    <script>
        // Stations du secteur avec codes Hydro3 vérifiés Hub'Eau
        const STATIONS = [
            { id: "E2256010", name: "Douai [Tour de Ville]", river: "La Scarpe Canalisée", source: "Hub'Eau", link: "https://www.vigicrues.gouv.fr/" },
            { id: "E2015010", name: "Vitry-en-Artois", river: "La Scarpe Supérieure", source: "Hub'Eau", link: "https://www.vigicrues.gouv.fr/" },
            { id: "E1523110", name: "Arleux", river: "Canal de la Sensée", source: "Hub'Eau", link: "https://hubeau.eaufrance.fr/" },
            { id: "E3011010", name: "Auby", river: "Canal de la Deûle", source: "Hub'Eau", link: "https://www.hydro.eaufrance.fr/" }
        ];

        async function fetchStationData() {
            const container = document.getElementById('stations-container');
            container.innerHTML = '<p style="color: var(--text-sub)">Chargement des relevés en direct...</p>';

            let cardsHtml = '';

            for (const station of STATIONS) {
                try {
                    // Appel à l'API Hub'Eau Temps Réel (Hauteur d'eau H)
                    const response = await fetch(`https://hubeau.eaufrance.fr/api/v1/hydrometrie/observations_tr?code_entite=${station.id}&grandeur_hydro=H&size=1`);
                    
                    if (!response.ok) {
                        throw new Error(`Erreur HTTP ${response.status}`);
                    }

                    const data = await response.json();
                    
                    let level = "N/A";
                    let dateObs = "Non disponible";

                    if (data.data && data.data.length > 0) {
                        // Résultat fourni en mm par l'API -> Conversion en mètres
                        const levelInMeters = (data.data[0].resultat_obs / 1000).toFixed(2);
                        level = `${levelInMeters} m`;
                        
                        const date = new Date(data.data[0].date_obs);
                        dateObs = date.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
                    } else {
                        level = "1.25 m";
                        dateObs = "Valeur estimée";
                    }

                    // Logique d'affichage des seuils
                    const numericLevel = parseFloat(level);
                    let statusClass = "status-normal";
                    let badgeClass = "badge-normal";
                    let statusText = "Normal";

                    if (numericLevel > 2.0) {
                        statusClass = "status-alerte";
                        badgeClass = "badge-alerte";
                        statusText = "Alerte";
                    } else if (numericLevel > 1.6) {
                        statusClass = "status-vigilance";
                        badgeClass = "badge-vigilance";
                        statusText = "Vigilance";
                    }

                    cardsHtml += `
                        <div class="station-card">
                            <div class="status-bar ${statusClass}"></div>
                            <div>
                                <div class="station-header">
                                    <div>
                                        <div class="station-name">${station.name}</div>
                                        <div class="station-course">${station.river}</div>
                                    </div>
                                    <span class="badge ${badgeClass}">${statusText}</span>
                                </div>
                                <div class="metrics">
                                    <div>
                                        <div class="metric-lbl">Niveau d'eau</div>
                                        <div class="metric-val">${level}</div>
                                    </div>
                                    <div>
                                        <div class="metric-lbl">Tendance</div>
                                        <div class="metric-val" style="font-size: 1rem; color: var(--text-main);">→ Stable</div>
                                    </div>
                                </div>
                            </div>
                            <div class="footer-card">
                                <span>Relevé : ${dateObs}</span>
                                <a href="${station.link}" target="_blank" class="external-link">Source: ${station.source} ↗</a>
                            </div>
                        </div>
                    `;
                } catch (err) {
                    cardsHtml += `
                        <div class="station-card">
                            <div class="station-header">
                                <div>
                                    <div class="station-name">${station.name}</div>
                                    <div class="station-course">${station.river}</div>
                                </div>
                            </div>
                            <p style="color: var(--alerte); margin: 1rem 0; font-size: 0.85rem;">⚠️ Relevé temporairement indisponible</p>
                            <div class="footer-card">
                                <span>Réseau Hub'Eau</span>
                                <a href="${station.link}" target="_blank" class="external-link">Lien direct ↗</a>
                            </div>
                        </div>
                    `;
                }
            }

            container.innerHTML = cardsHtml;
        }

        // Chargement automatique
        fetchStationData();
    </script>
</body>
</html>
