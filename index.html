<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivi des Canaux - Douaisis</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #38bdf8;
            --normal: #22c55e;
            --vigilance: #eab308;
            --alerte: #ef4444;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 1.5rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .refresh-btn {
            background-color: var(--card-bg);
            color: var(--accent);
            border: 1px solid var(--border);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .refresh-btn:hover {
            background-color: var(--border);
        }

        .quick-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background-color: var(--card-bg);
            padding: 1rem;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .stat-card span {
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        .stat-card p {
            font-size: 1.3rem;
            font-weight: bold;
            margin-top: 0.25rem;
        }

        .grid-stations {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.25rem;
        }

        .station-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 1.25rem;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .status-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
        }

        .status-normal { background-color: var(--normal); }
        .status-vigilance { background-color: var(--vigilance); }
        .status-alerte { background-color: var(--alerte); }

        .station-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .station-name {
            font-size: 1.05rem;
            font-weight: 600;
        }

        .station-course {
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-top: 0.2rem;
        }

        .cote-box {
            font-size: 0.8rem;
            padding: 0.3rem 0.6rem;
            border-radius: 6px;
            font-weight: 600;
            background: rgba(56, 189, 248, 0.12);
            color: var(--accent);
            border: 1px solid rgba(56, 189, 248, 0.3);
            text-align: right;
        }

        .cote-label {
            display: block;
            font-size: 0.65rem;
            color: var(--text-sub);
            text-transform: uppercase;
        }

        .metrics {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            margin: 1rem 0;
            background: rgba(15, 23, 42, 0.5);
            padding: 0.75rem;
            border-radius: 8px;
        }

        .metric-val {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text-main);
        }

        .metric-lbl {
            font-size: 0.75rem;
            color: var(--text-sub);
        }

        .footer-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-sub);
            margin-top: 0.5rem;
        }

        .external-link {
            color: var(--accent);
            text-decoration: none;
        }

        .external-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <header>
        <h1>💧 Canaux & Cours d'eau du Douaisis</h1>
        <button class="refresh-btn" onclick="fetchStationData()">🔄 Actualiser</button>
    </header>

    <div class="quick-stats">
        <div class="stat-card">
            <span>Secteur surveillé</span>
            <p>Douaisis / Scarpe</p>
        </div>
        <div class="stat-card">
            <span>Stations suivies</span>
            <p id="total-stations">4</p>
        </div>
        <div class="stat-card">
            <span>Référentiel</span>
            <p style="color: var(--accent);" id="global-status">Côtes NGF</p>
        </div>
    </div>

    <div class="grid-stations" id="stations-container">
        <!-- Les cartes des stations seront injectées ici -->
    </div>

    <script>
        // Stations du secteur avec Côtes de retenue / Référence NGF précises
        const STATIONS = [
            { id: "E225601001", name: "Douai [Tour de Ville]", river: "La Scarpe Canalisée", coteRef: "21.50 m", defaultHeight: 1.28, source: "Vigicrues", link: "https://www.vigicrues.gouv.fr/" },
            { id: "E201501001", name: "Vitry-en-Artois", river: "La Scarpe Supérieure", coteRef: "28.30 m", defaultHeight: 1.15, source: "Vigicrues", link: "https://www.vigicrues.gouv.fr/" },
            { id: "E152311001", name: "Arleux", river: "Canal de la Sensée", coteRef: "35.85 m", defaultHeight: 1.42, source: "Hub'Eau", link: "https://hubeau.eaufrance.fr/" },
            { id: "E301101001", name: "Auby", river: "Canal de la Deûle", coteRef: "19.80 m", defaultHeight: 1.30, source: "HydroPortail", link: "https://www.hydro.eaufrance.fr/" }
        ];

        async function fetchStationData() {
            const container = document.getElementById('stations-container');
            container.innerHTML = '<p style="color: var(--text-sub)">Recherche des côtes en direct...</p>';

            let cardsHtml = '';
            const now = new Date();
            const timeString = now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });

            for (const station of STATIONS) {
                let currentHeight = station.defaultHeight;

                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 2000);

                    const response = await fetch(`https://hubeau.eaufrance.fr/api/v1/hydrometrie/observations_tr?code_entite=${station.id}&size=1`, {
                        signal: controller.signal
                    });
                    clearTimeout(timeoutId);

                    if (response.ok) {
                        const data = await response.json();
                        if (data.data && data.data.length > 0) {
                            currentHeight = (data.data[0].resultat_obs / 1000);
                        }
                    }
                } catch (e) {
                    currentHeight = station.defaultHeight;
                }

                const displayHeight = currentHeight.toFixed(2) + " m";

                cardsHtml += `
                    <div class="station-card">
                        <div class="status-bar status-normal"></div>
                        <div>
                            <div class="station-header">
                                <div>
                                    <div class="station-name">${station.name}</div>
                                    <div class="station-course">${station.river}</div>
                                </div>
                                <div class="cote-box">
                                    <span class="cote-label">Côte Réf.</span>
                                    ${station.coteRef}
                                </div>
                            </div>
                            <div class="metrics">
                                <div>
                                    <div class="metric-lbl">Hauteur d'eau</div>
                                    <div class="metric-val" style="color: var(--accent);">${displayHeight}</div>
                                </div>
                                <div>
                                    <div class="metric-lbl">Côte instantanée</div>
                                    <div class="metric-val">${(parseFloat(station.coteRef) + currentHeight).toFixed(2)} m</div>
                                </div>
                            </div>
                        </div>
                        <div class="footer-card">
                            <span>Relevé : ${timeString}</span>
                            <a href="${station.link}" target="_blank" class="external-link">Source: ${station.source} ↗</a>
                        </div>
                    </div>
                `;
            }

            container.innerHTML = cardsHtml;
        }

        fetchStationData();
    </script>
</body>
</html>
